<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EAEEF3; --line:#D9DFE7;
  --ink:#141820; --muted:#5A6272; --accent:#0A6BB3; --accent-ink:#FFFFFF; --accent-soft:#DCEBF7;
  --must:#C2185B; --must-soft:#FBE3EC; --want:#B7791F; --want-soft:#FBF0DC;
  --ok:#2E7D4F; --shadow:0 6px 24px rgba(20,30,50,.14);
  --c:#00A0DC; --m:#E6007E; --y:#FFE600; --k:#1A1A1A;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1216; --surface:#181C22; --surface2:#222831; --line:#2E3540;
    --ink:#E7EAEF; --muted:#9AA3B1; --accent:#4BA6EE; --accent-ink:#0B1520; --accent-soft:#16304A;
    --must:#F06C9B; --must-soft:#3A1826; --want:#E3B25A; --want-soft:#35291A;
    --ok:#6CC592; --shadow:0 6px 24px rgba(0,0,0,.5); --k:#E7EAEF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1216; --surface:#181C22; --surface2:#222831; --line:#2E3540;
  --ink:#E7EAEF; --muted:#9AA3B1; --accent:#4BA6EE; --accent-ink:#0B1520; --accent-soft:#16304A;
  --must:#F06C9B; --must-soft:#3A1826; --want:#E3B25A; --want-soft:#35291A;
  --ok:#6CC592; --shadow:0 6px 24px rgba(0,0,0,.5); --k:#E7EAEF;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.cmyk{display:flex;height:4px;border-radius:2px;overflow:hidden;width:56px;margin-bottom:8px}
.cmyk i{flex:1}
.cmyk i:nth-child(1){background:var(--c)}.cmyk i:nth-child(2){background:var(--m)}.cmyk i:nth-child(3){background:var(--y)}.cmyk i:nth-child(4){background:var(--k)}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.search{margin-top:10px;position:relative}
.sectionhead.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,150px));z-index:15;background:var(--bg);margin:0 -16px 8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px 10px 36px;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

.notice{margin-top:12px;font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.notice b{color:var(--ink)}

.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 0 10px}
.sectionhead h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sectionhead .back{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:76px}
.tile:active{transform:scale(.985)}
.tile .nm{font-weight:600;font-size:14px;line-height:1.35}
.tile .meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;font-size:12px;color:var(--muted)}
.count{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--ink)}
.count.zero{color:var(--muted);opacity:.6}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--must);margin-right:4px;vertical-align:1px}
.hallcode{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:.02em;line-height:1}
.halltheme{font-size:12px;color:var(--muted);line-height:1.35}

.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.card.must{border-left:3px solid var(--must)}
.loc{grid-row:span 3;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:54px;padding-top:2px}
.loc .h{font-family:var(--mono);font-weight:600;font-size:17px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:4px 7px;line-height:1.1}
.loc .h.none{background:var(--surface2);color:var(--muted);font-size:12px;font-family:var(--sans)}
.loc .b{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card .name{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.card .prod{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.card .memo{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.chip{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;white-space:nowrap}
.pill.must{background:var(--must-soft);color:var(--must)}
.pill.want{background:var(--want-soft);color:var(--want)}
.cardfoot{grid-column:2;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;color:var(--muted)}
.cardfoot a{color:var(--accent);text-decoration:none;font-weight:500}
.edit{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:28px 12px;border:1px dashed var(--line);border-radius:12px}
.empty button{margin-top:10px}

.groupname{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:520px}
nav.tabs button{border:0;background:none;border-radius:10px;padding:7px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:13px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}

.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{left:50%;transform:translateX(-50%);width:640px}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:17px;margin:0 0 12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label,.field .lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pick.pri button[data-v="must"][aria-pressed="true"]{background:var(--must);border-color:var(--must);color:#fff}
.pick.pri button[data-v="want"][aria-pressed="true"]{background:var(--want);border-color:var(--want);color:#fff}
.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--must);border-color:var(--must-soft)}
.btn.danger.armed{background:var(--must);color:#fff;border-color:var(--must)}
.btn:disabled{opacity:.5}
.err{color:var(--must);font-size:13px;margin:0 0 10px}
.setrow{display:grid;grid-template-columns:78px 1fr 36px;gap:6px;margin-bottom:6px}
.setrow.cat{grid-template-columns:1fr 36px}
.setrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;min-width:0}
.setrow .x{border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--muted)}
.addline{border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;width:100%;color:var(--accent);font-weight:600;font-size:13px;margin-bottom:16px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}@media (min-width:700px){.sheet{animation:none}}}
</style>
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.who{display:flex;gap:6px;align-items:center}
.conn{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.conn.on{background:var(--ok)}
.status{font-size:12px;color:var(--muted);white-space:nowrap;padding:0 4px}
.ver{display:inline-block;vertical-align:3px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;letter-spacing:.02em}
.tile .en{font-size:11.5px;color:var(--muted);line-height:1.3}
.tile.hall{border-top:4px solid var(--seg)}
.planbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.hallplan{cursor:zoom-in;max-height:70vh}
.hallplan img{min-width:0!important;width:100%}
.hallplan.zoom{cursor:zoom-out}
.hallplan.zoom img{width:300%!important;max-width:none}
.plan{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.plan img{display:block;width:100%;max-width:none;min-width:640px}
@media (min-width:700px){.plan img{min-width:0}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ── Firebase 설정 ──
   새 Firebase 프로젝트를 만들면 아래 값만 교체하세요. */
const firebaseConfig = {
  apiKey: "AIzaSyAnhodesyW_2SOly1oMAB25M1MOyfb8piA",
  authDomain: "coffee-order-f1e1b.firebaseapp.com",
  databaseURL: "https://coffee-order-f1e1b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "coffee-order-f1e1b",
  storageBucket: "coffee-order-f1e1b.firebasestorage.app",
  messagingSenderId: "157369526558",
  appId: "1:157369526558:web:3b9014c72055e89b45010f"
};
const ROOT = "aip2026";               // 데이터 저장 위치 (커피 앱 데이터와 분리)
const DEFAULT_ADMIN_PW = "aip2026";   // 설정 변경용 초기 비밀번호

const fb = initializeApp(firebaseConfig);
const db = getDatabase(fb);
const R = p => ref(db, `${ROOT}/${p}`);

const APP_VERSION = "1.3.2";
const HALL_PLANS = ["E3","E4","E5","E6","E7","N1","N2","N3","N4","N5"];   // plans/<홀>.jpg
const CONFIG_VERSION = "1.3";   // 이 값이 바뀌면 저장된 홀·카테고리를 아래 기본값으로 교체합니다.

// 홀 색상은 공식 배치도 범례와 같습니다.
const SEG = {
  dig:  {c:"#D6589A", t:"디지털 인쇄·프리프레스"},
  pack: {c:"#5AAEE0", t:"포장인쇄·후가공"},
  label:{c:"#1F5AA0", t:"라벨·연포장·인쇄자재 및 부품"},
  ink:  {c:"#12B5A5", t:"잉크·신소재"},
  ai:   {c:"#1BAA4A", t:"혁신 디지털·지능화 기술"},
  print:{c:"#9CC83B", t:"종합 인쇄"},
  cpk:  {c:"#F08378", t:"종합 포장"}
};
// 카테고리 id는 버전이 바뀌어도 유지합니다 (k02 출판 소프트웨어, k09 디지털 출력장비/시스템은 v1.3에서 삭제).
const CAT_IDS = ["k01","k03","k04","k05","k06","k07","k08","k10","k11","k12","k13","k14","k15","k16","k17","k18"];
const DEFAULT_CONFIG = {
  version: CONFIG_VERSION,
  halls: [
    ["E3",SEG.ai.t,SEG.ai.c],["E4",SEG.cpk.t,SEG.cpk.c],["E5",SEG.print.t,SEG.print.c],
    ["E6",SEG.label.t+" / "+SEG.ink.t,SEG.label.c],["E7",SEG.pack.t,SEG.pack.c],
    ["N1",SEG.dig.t,SEG.dig.c],["N2",SEG.dig.t,SEG.dig.c],["N3",SEG.pack.t,SEG.pack.c],
    ["N4",SEG.pack.t,SEG.pack.c],["N5",SEG.pack.t,SEG.pack.c]
  ].map(([code,theme,color])=>({id:code, code, theme, color})),
  categories: [
    ["프리프레스 장비","Pre-press equipment"],
    ["워크플로우/데이터 핸들링 소프트웨어","Workflow and data handling software"],
    ["칼라 매니지먼트 시스템","Color management system"],
    ["ERP","Enterprise resource planning"],
    ["디지털 출력장비","Printing equipment"],
    ["낱장 옵셋","Sheet-fed offset printing machines"],
    ["윤전 옵셋","Web-fed offset printing machines"],
    ["제본기/후가공기","Bookbinding machines and print finishing machines"],
    ["라미네이팅 장비","Laminating machines"],
    ["박장비","Foil stamping machines"],
    ["재단기","Cutting machines"],
    ["종이/소재","Paper and substrate"],
    ["토너/잉크","Toners and inks"],
    ["코팅/바니쉬","Coatings / varnishes"],
    ["재본자재","Bookbinding materials"],
    ["공간 제어 설비","Room climate & conditioning"]
  ].map(([name,en],i)=>({id:CAT_IDS[i], name, en}))
};
// v1.0 → v1.1 전환: 이미 등록된 업체의 카테고리·홀을 새 목록으로 옮깁니다.
const MIGRATE_CATS = { c01:["k06"], c02:["k06"], c03:["k01"], c04:["k03"], c05:["k07"], c06:["k06"], c07:["k06"], c08:["k06"],
  c10:["k10"], c11:["k13"], c12:["k10","k12","k16"], c13:["k10"], c14:["k15"], c15:["k14"], c17:["k06"] };
// v1.3: 삭제된 카테고리의 업체를 옮깁니다 (디지털 출력장비/시스템 → 디지털 출력장비, 출판 소프트웨어 → 없음).
const REMAP_13 = { k09:["k06"], k02:[] };
const remap13 = list => [...new Set(list.flatMap(c => c in REMAP_13 ? REMAP_13[c] : [c]))];
const MIGRATE_HALLS = { h8:"E3", h9:"E4", h10:"E5" };
const SEED_EXHIBITORS = [
  ["HP",["k06"]],["Canon",["k06"]],["Epson",["k06"]],["Heidelberg",["k07","k03"]],
  ["Kodak",["k01"]],["Konica Minolta",["k06"]],["Bobst",["k13"]]
];

const ls = {
  get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

const S = { config: DEFAULT_CONFIG, ex:[], loaded:false, tab: ls.get("aip_tab","cat"), sel:null, q:"", online:false };

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr = v => Array.isArray(v) ? v.filter(x=>x!=null) : (v && typeof v==="object" ? Object.values(v) : []);
const hallById = id => S.config.halls.find(h=>h.id===id);
const catById = id => S.config.categories.find(c=>c.id===id);
const collator = new Intl.Collator("ko",{numeric:true,sensitivity:"base"});

function matchesQ(e){
  if(!S.q) return true;
  const q = S.q.toLowerCase();
  const cats = e.cats.map(id=>catById(id)?.name||"").join(" ");
  return [e.name,e.products,e.memo,e.booth,cats,hallById(e.hall)?.code].join(" ").toLowerCase().includes(q);
}
const prRank = x => x.priority==="must"?0:x.priority==="want"?1:2;
const sortEx = (a,b) => prRank(a)-prRank(b) || collator.compare(a.name||"",b.name||"");
const sortByBooth = (a,b) => collator.compare(a.booth||"~",b.booth||"~") || collator.compare(a.name||"",b.name||"");

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

/* ── 화면 그리기 ── */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  $("#conn").className = "conn" + (S.online ? " on" : "");
  $("#connText").lastChild.textContent = S.online ? "실시간" : "연결 끊김";
  const m = $("#main");
  if(!S.loaded){ m.innerHTML='<div class="empty" style="margin-top:18px">공유 목록을 불러오는 중…</div>'; return; }
  if(S.q){ m.innerHTML = listSection(`검색: “${esc(S.q)}”`, S.ex.filter(matchesQ).sort(sortEx), "검색 결과가 없습니다."); bind(); return; }
  if(S.tab==="cat") m.innerHTML = S.sel ? catDetail(S.sel) : catGrid();
  else if(S.tab==="hall") m.innerHTML = S.sel ? hallDetail(S.sel) : hallGrid();
  else m.innerHTML = listSection("전체 관심 업체", S.ex.slice().sort(sortEx), "아직 등록된 업체가 없습니다.");
  bind();
}
function countFor(pred){ const l=S.ex.filter(pred); return {n:l.length, must:l.filter(e=>e.priority==="must").length}; }
function tileMeta(k){ return `<span class="meta"><span>${k.must?`<span class="dot"></span>필수 ${k.must}`:""}</span><span class="count ${k.n?"":"zero"}">${k.n}곳</span></span>`; }

function catGrid(){
  const tiles = S.config.categories.map(c=>`<button class="tile" type="button" data-open="${esc(c.id)}"><span class="nm">${esc(c.name)}</span>${c.en?`<span class="en">${esc(c.en)}</span>`:""}${tileMeta(countFor(e=>e.cats.includes(c.id)))}</button>`).join("");
  return `<div class="sectionhead"><h2>카테고리 ${S.config.categories.length}개</h2><span class="sub">관심 업체 ${S.ex.length}곳</span></div><div class="grid">${tiles}</div>`;
}
function hallGrid(){
  const un = countFor(e=>!hallById(e.hall));
  const tiles = S.config.halls.map(h=>`<button class="tile hall" type="button" data-open="${esc(h.id)}" style="--seg:${esc(h.color||"var(--line)")}"><span class="hallcode">${esc(h.code)}</span>${h.theme?`<span class="halltheme">${esc(h.theme)}</span>`:""}${tileMeta(countFor(e=>e.hall===h.id))}</button>`).join("");
  const unTile = un.n ? `<button class="tile" type="button" data-open="__none"><span class="nm">홀 미정</span><span class="halltheme">위치 확인 필요</span>${tileMeta(un)}</button>` : "";
  return `<div class="sectionhead"><h2>전시홀 ${S.config.halls.length}개</h2><button class="back" type="button" id="btnPlan">배치도 보기</button></div><p class="sub" style="margin:-4px 0 10px">홀을 누르면 그 홀의 관심 업체만 보여줍니다</p><div class="grid">${tiles}${unTile}</div>`;
}
function catDetail(id){
  const c = catById(id); if(!c){ S.sel=null; return catGrid(); }
  const list = S.ex.filter(e=>e.cats.includes(id));
  const order = [...S.config.halls.map(h=>h.id),"__none"];
  const groups = order.map(hid=>({hid, items:list.filter(e=>hid==="__none"?!hallById(e.hall):e.hall===hid).sort(sortByBooth)})).filter(g=>g.items.length);
  const body = groups.length ? groups.map(g=>`<div class="groupname">${g.hid==="__none"?"홀 미정":esc(hallById(g.hid).code)+" 홀"} · ${g.items.length}곳</div><div class="list">${g.items.map(cardHTML).join("")}</div>`).join("")
    : emptyHTML("이 카테고리에 등록된 업체가 아직 없습니다.",{cats:[id]});
  return `<div class="sectionhead stick"><button class="back" type="button" data-back>‹ 카테고리</button><span class="sub">${list.length}곳 · 홀별 정리</span></div><h2 style="font-size:20px;margin:0 0 2px">${esc(c.name)}</h2>${c.en?`<p class="sub" style="margin:0 0 6px">${esc(c.en)}</p>`:""}${body}`;
}
function hallDetail(id){
  const none = id==="__none", h = hallById(id);
  if(!none && !h){ S.sel=null; return hallGrid(); }
  const list = S.ex.filter(e=>none?!hallById(e.hall):e.hall===id).sort(sortByBooth);
  const body = list.length ? `<div class="list">${list.map(cardHTML).join("")}</div>` : emptyHTML("이 홀에 등록된 관심 업체가 아직 없습니다.", none?{}:{hall:id});
  const hasPlan = h && HALL_PLANS.includes(h.code);
  return `<div class="sectionhead stick"><button class="back" type="button" data-back>‹ 전시홀</button>${hasPlan?`<button class="planbtn" type="button" data-plan="${esc(h.code)}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>${esc(h.code)} 홀 배치도</button>`:`<span class="sub">${list.length}곳</span>`}</div>
    <h2 style="font-size:20px;margin:0 0 4px;font-family:var(--mono)">${none?"홀 미정":esc(h.code)+" 홀"}</h2>${hasPlan?`<p class="sub" style="margin:0 0 4px">관심 업체 ${list.length}곳 · 부스 번호순</p>`:""}${h&&h.theme?`<p class="sub" style="margin:0 0 10px">${esc(h.theme)}</p>`:""}${body}`;
}
function listSection(title,list,emptyMsg){
  return `<div class="sectionhead"><h2>${title}</h2><span class="sub">${list.length}곳</span></div>` + (list.length?`<div class="list">${list.map(cardHTML).join("")}</div>`:emptyHTML(emptyMsg,{}));
}
function emptyHTML(msg,preset){
  return `<div class="empty">${esc(msg)}<br><button class="btn primary" type="button" data-add='${esc(JSON.stringify(preset||{}))}'>업체 등록</button></div>`;
}
function cardHTML(e){
  const h = hallById(e.hall);
  const cats = e.cats.map(catById).filter(Boolean).map(c=>`<span class="chip">${esc(c.name)}</span>`).join("");
  const pri = e.priority==="must"?'<span class="pill must">필수 방문</span>':e.priority==="want"?'<span class="pill want">관심</span>':"";
  let url=(e.url||"").trim(); if(url && !/^https?:\/\//i.test(url)) url="https://"+url;
  return `<article class="card ${e.priority==="must"?"must":""}">
    <div class="loc">${h?`<span class="h">${esc(h.code)}</span>`:`<span class="h none">미정</span>`}${e.booth?`<span class="b">${esc(e.booth)}</span>`:""}</div>
    <div class="top"><span class="name">${esc(e.name)}</span>${pri}</div>
    ${e.products?`<div class="prod">${esc(e.products)}</div>`:""}
    ${cats?`<div class="chips">${cats}</div>`:""}
    ${e.memo?`<div class="memo" style="grid-column:2">${esc(e.memo)}</div>`:""}
    <div class="cardfoot"><span>${url?`<a href="${esc(url)}" target="_blank" rel="noopener">웹사이트 ↗</a>`:""}</span>
      <button class="edit" type="button" data-edit="${esc(e.id)}">수정</button></div>
  </article>`;
}
function bind(){
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ S.sel=b.dataset.open; render(); window.scrollTo(0,0); });
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{ S.sel=null; render(); });
  const bp=document.getElementById("btnPlan"); if(bp) bp.onclick=openPlan;
  document.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>openHallPlan(b.dataset.plan));
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(S.ex.find(e=>e.id===b.dataset.edit)));
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ let p={}; try{p=JSON.parse(b.dataset.add)}catch(e){} openEditor(null,p); });
}

/* ── 배치도 ── */
function openPlan(){
  $("#layer").innerHTML = `<div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-label="전시장 배치도">
    <div class="grab"></div><h3>전시장 배치도 · SNIEC</h3>
    <div class="plan"><img src="floor-plan.png?v=${APP_VERSION}" alt="상하이 신국제엑스포센터 전시홀 배치도: E3~E7, N1~N5"></div>
    <p class="sub" style="margin:8px 0 12px">두 손가락으로 확대할 수 있어요. 입구: 1번(E1·W1 사이), 2번(W5·N1 사이), 3번(E7·N5 사이)</p>
    <div class="actions"><span></span><button type="button" class="btn" data-close>닫기</button></div>
  </div>`;

}

/* ── 홀별 부스 배치도 ── */
function openHallPlan(code){
  $("#layer").innerHTML = `<div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-label="${esc(code)} 홀 배치도">
    <div class="grab"></div><h3>${esc(code)} 홀 부스 배치도</h3>
    <p class="sub" style="margin:-6px 0 10px">그림을 누르면 크게 보이고, 좌우로 밀어서 부스 번호를 찾을 수 있어요. 한 번 더 누르면 전체 보기로 돌아가요.</p>
    <div class="plan hallplan" id="hallPlan"><img src="plans/${esc(code)}.jpg?v=${APP_VERSION}" alt="${esc(code)} 홀 부스 배치도"></div>
    <div class="actions" style="margin-top:12px"><span></span><button type="button" class="btn" data-close>닫기</button></div>
  </div>`;
  document.body.style.overflow="hidden";
  document.querySelectorAll("#layer [data-close]").forEach(b=>b.onclick=closeLayer);
  const box=$("#hallPlan");
  box.onclick=ev=>{
    const r=box.getBoundingClientRect(), fx=(ev.clientX-r.left)/r.width, fy=(ev.clientY-r.top)/r.height;
    const zoom=!box.classList.contains("zoom");
    box.classList.toggle("zoom",zoom);
    if(zoom){ box.scrollLeft = fx*box.scrollWidth - box.clientWidth/2; box.scrollTop = fy*box.scrollHeight - box.clientHeight/2; }
  };
}

/* ── 업체 등록/수정 ── */
function closeLayer(){ $("#layer").innerHTML=""; document.body.style.overflow=""; }
function openEditor(ex, preset){
  preset = preset||{};
  const d = ex ? {...ex, cats:[...ex.cats]} : {name:"",hall:preset.hall||"",booth:"",cats:preset.cats||[],products:"",memo:"",priority:"",url:""};
  if(!ex && S.tab==="hall" && S.sel && S.sel!=="__none" && !d.hall) d.hall=S.sel;
  if(!ex && S.tab==="cat" && S.sel && !d.cats.length) d.cats=[S.sel];
  const hallOpts = `<option value="">홀 미정</option>` + S.config.halls.map(h=>`<option value="${esc(h.id)}" ${d.hall===h.id?"selected":""}>${esc(h.code)}${h.theme?" · "+esc(h.theme):""}</option>`).join("");
  $("#layer").innerHTML = `<div class="scrim" data-close></div>
  <form class="sheet" id="exForm" role="dialog" aria-label="업체 ${ex?"수정":"등록"}">
    <div class="grab"></div><h3>${ex?"업체 정보 수정":"관심 업체 등록"}</h3>
    <p class="err" id="exErr" hidden></p>
    <div class="field"><label for="f-name">업체명 *</label><input id="f-name" required maxlength="120" value="${esc(d.name)}" placeholder="예: Heidelberg"></div>
    <div class="row2">
      <div class="field"><label for="f-hall">전시홀</label><select id="f-hall">${hallOpts}</select></div>
      <div class="field"><label for="f-booth">부스 번호</label><input id="f-booth" maxlength="30" value="${esc(d.booth)}" placeholder="예: W2-A01"></div>
    </div>
    <div class="field"><span class="lbl">카테고리 (여러 개 선택 가능)</span><div class="pick" id="f-cats">${S.config.categories.map(c=>`<button type="button" data-id="${esc(c.id)}" aria-pressed="${d.cats.includes(c.id)}">${esc(c.name)}</button>`).join("")}</div></div>
    <div class="field"><label for="f-prod">솔루션·제품</label><textarea id="f-prod" maxlength="600" placeholder="예: Versafire LP 디지털 인쇄기, Prinect 워크플로">${esc(d.products)}</textarea></div>
    <div class="field"><span class="lbl">우선순위</span><div class="pick pri" id="f-pri">
      <button type="button" data-v="must" aria-pressed="${d.priority==="must"}">필수 방문</button>
      <button type="button" data-v="want" aria-pressed="${d.priority==="want"}">관심</button>
      <button type="button" data-v="" aria-pressed="${!d.priority}">참고</button></div></div>
    <div class="field"><label for="f-memo">메모 (확인할 내용, 담당자 등)</label><textarea id="f-memo" maxlength="800">${esc(d.memo)}</textarea></div>
    <div class="field"><label for="f-url">웹사이트</label><input id="f-url" maxlength="300" inputmode="url" value="${esc(d.url)}" placeholder="www.example.com"></div>
    <div class="actions">
      ${ex?`<button type="button" class="btn danger" id="exDel">삭제</button>`:`<span></span>`}
      <div style="display:flex;gap:8px"><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary" id="exSave">${ex?"저장":"등록"}</button></div>
    </div>
  </form>`;
  document.body.style.overflow="hidden";
  document.querySelectorAll("#layer [data-close]").forEach(b=>b.onclick=closeLayer);
  document.querySelectorAll("#f-cats button").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true")));
  document.querySelectorAll("#f-pri button").forEach(b=>b.onclick=()=>document.querySelectorAll("#f-pri button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))));
  const err = m=>{ const e=$("#exErr"); e.textContent=m; e.hidden=!m; };
  $("#exForm").onsubmit = async ev=>{
    ev.preventDefault();
    const name=$("#f-name").value.trim(); if(!name){ err("업체명을 입력하세요."); return; }
    const now=new Date().toISOString();
    const body = {
      name, hall:$("#f-hall").value, booth:$("#f-booth").value.trim(),
      cats:[...document.querySelectorAll("#f-cats button[aria-pressed=true]")].map(b=>b.dataset.id),
      products:$("#f-prod").value.trim(), memo:$("#f-memo").value.trim(),
      priority:document.querySelector("#f-pri button[aria-pressed=true]")?.dataset.v||"",
      url:$("#f-url").value.trim(), updatedAt:now,
      createdAt:ex?.createdAt||now
    };
    $("#exSave").disabled=true;
    try{
      if(ex) await set(R(`exhibitors/${ex.id}`), body);
      else await set(push(R("exhibitors")), body);
      closeLayer(); toast(ex?"저장했습니다":"등록했습니다 · 모든 팀원에게 공유됨");
    }catch(e){ $("#exSave").disabled=false; err("저장하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요."); }
  };
  if(ex){
    const del=$("#exDel");
    del.onclick=async()=>{
      if(!del.classList.contains("armed")){ del.classList.add("armed"); del.textContent="한 번 더 누르면 삭제"; return; }
      del.disabled=true;
      try{ await remove(R(`exhibitors/${ex.id}`)); closeLayer(); toast("삭제했습니다"); }
      catch(e){ del.disabled=false; err("삭제하지 못했습니다. 다시 시도하세요."); }
    };
  }
}

/* ── 설정 (관리자 비밀번호 필요) ── */
function openSettings(){
  $("#layer").innerHTML = `<div class="scrim" data-close></div>
  <form class="sheet" id="pwForm" role="dialog" aria-label="관리자 확인">
    <div class="grab"></div><h3>전시홀·카테고리 설정</h3>
    <p class="sub" style="margin:-6px 0 14px">설정 변경은 관리자 비밀번호가 필요합니다.</p>
    <p class="err" id="pwErr" hidden></p>
    <div class="field"><label for="pw">관리자 비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>

  </form>`;
  document.body.style.overflow="hidden";
  document.querySelectorAll("#layer [data-close]").forEach(b=>b.onclick=closeLayer);

    openConfigEditor();
  };
}

      <button type="button" class="addline" id="addHall">＋ 전시홀 추가</button>
      <div class="field" style="margin-top:6px"><span class="lbl">카테고리 (${cats.length})</span></div>
      ${cats.map((c,i)=>`<div class="setrow"><input id="cn-${c.id}" data-c="${i}" data-k="name" value="${esc(c.name)}" aria-label="카테고리 이름" style="grid-column:span 1"><input id="ce-${c.id}" data-c="${i}" data-k="en" value="${esc(c.en||"")}" placeholder="English" aria-label="영문명"><button type="button" class="x" data-rmc="${i}" aria-label="삭제">✕</button></div>`).join("")}
      <button type="button" class="addline" id="addCat">＋ 카테고리 추가</button>
      <div class="field"><label for="newpw">관리자 비밀번호 변경 (비워두면 유지)</label><input id="newpw" type="password" autocomplete="new-password"></div>
      <div class="actions"><span class="sub">삭제한 홀의 업체는 ‘홀 미정’으로 표시됩니다.</span>
        <div style="display:flex;gap:8px"><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary" id="setSave">저장</button></div></div>
    </form>`;
    document.querySelectorAll("#layer [data-close]").forEach(b=>b.onclick=closeLayer);
    document.querySelectorAll("[data-h]").forEach(inp=>inp.oninput=()=>{ halls[+inp.dataset.h][inp.dataset.k]=inp.value; });
    document.querySelectorAll("[data-c]").forEach(inp=>inp.oninput=()=>{ cats[+inp.dataset.c][inp.dataset.k]=inp.value; });
    document.querySelectorAll("[data-rmh]").forEach(b=>b.onclick=()=>{ halls.splice(+b.dataset.rmh,1); draw(); });
    document.querySelectorAll("[data-rmc]").forEach(b=>b.onclick=()=>{ cats.splice(+b.dataset.rmc,1); draw(); });
    const nid=p=>p+Date.now().toString(36);
    $("#addHall").onclick=()=>{ halls.push({id:nid("h"),code:"",theme:"",color:""}); draw(); };
    $("#addCat").onclick=()=>{ cats.push({id:nid("k"),name:"",en:""}); draw(); };
    $("#setForm").onsubmit=async ev=>{
      ev.preventDefault();
      const H=halls.map(h=>({id:h.id,code:(h.code||"").trim(),theme:(h.theme||"").trim(),color:h.color||""})).filter(h=>h.code);
      const C=cats.map(c=>({id:c.id,name:(c.name||"").trim(),en:(c.en||"").trim()})).filter(c=>c.name);
      const e=$("#setErr");
      if(!H.length||!C.length){ e.textContent="전시홀과 카테고리를 각각 하나 이상 입력하세요."; e.hidden=false; return; }
      $("#setSave").disabled=true;
      try{
        await set(R("config"),{version:CONFIG_VERSION,halls:H,categories:C,updatedAt:new Date().toISOString()});
        const np=$("#newpw").value; if(np) await set(R("adminPw"),np);
        closeLayer(); toast("설정을 저장했습니다");
      }catch(err){ $("#setSave").disabled=false; e.textContent="저장하지 못했습니다. 다시 시도하세요."; e.hidden=false; }
    };
  };
  draw();
}

/* ── 상단 고정 줄 위치 (헤더 높이) ── */
const topHeader = document.querySelector("header.top");
const setHH = ()=>document.documentElement.style.setProperty("--hh", topHeader.offsetHeight+"px");
setHH(); window.addEventListener("resize", setHH);
if(window.ResizeObserver) new ResizeObserver(setHH).observe(topHeader);

/* ── 이벤트 ── */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  S.tab=b.dataset.tab; S.sel=null; S.q=""; $("#q").value=""; ls.set("aip_tab",S.tab); render(); window.scrollTo(0,0);
});
let qt; $("#q").addEventListener("input",e=>{ clearTimeout(qt); qt=setTimeout(()=>{ S.q=e.target.value.trim(); render(); },120); });
$("#fab").onclick=()=>openEditor(null,{});
$("#btnSettings").onclick=openSettings;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLayer(); });

/* ── Firebase 연결 ── */
async function init(){
  // 최초 1회: 기본 설정과 참가 확정 업체를 넣어 둡니다.
  const cfg = await get(R("config"));
  const cur = cfg.exists() ? cfg.val() : null;
  const exSnap = await get(R("exhibitors"));
  const exAll = exSnap.exists() ? exSnap.val() : null;
  const now = new Date().toISOString();
  if(!cur || cur.version !== CONFIG_VERSION){
    const updates = {};
    const fromV10 = !cur || !cur.version;
    if(fromV10){
      updates[`${ROOT}/config`] = {...DEFAULT_CONFIG, updatedAt:now};
    } else {
      // v1.1/v1.2 → v1.3: 관리자가 바꾼 홀·카테고리는 유지하고 요청된 변경만 적용합니다.
      const cats = arr(cur.categories).filter(c=>!(c.id in REMAP_13))
        .map(c=> c.id==="k06" && c.name==="출력장비" ? {...c, name:"디지털 출력장비"} : c);
      updates[`${ROOT}/config`] = {...cur, version:CONFIG_VERSION, categories:cats, updatedAt:now};
    }
    if(exAll){
      Object.entries(exAll).forEach(([id,e])=>{
        const oldCats = arr(e.cats);
        let cats = oldCats.flatMap(c=>MIGRATE_CATS[c] || (/^k\d\d$/.test(c)?[c]:[]));
        cats = remap13(cats);
        if(JSON.stringify(cats)!==JSON.stringify(oldCats)) updates[`${ROOT}/exhibitors/${id}/cats`] = cats;
        if(e.hall && /^h\d+$/.test(e.hall)) updates[`${ROOT}/exhibitors/${id}/hall`] = MIGRATE_HALLS[e.hall] || "";
      });
    } else if(fromV10){
      SEED_EXHIBITORS.forEach(([name,cats])=>{
        const k=push(R("exhibitors")).key;
        updates[`${ROOT}/exhibitors/${k}`]={name,hall:"",booth:"",cats,products:"",memo:"주최측 참가 확정 발표 · 홀·부스 확인 필요",priority:"",url:"",createdAt:now,updatedAt:now};
      });
    }
    await update(ref(db), updates);
  }
  let gotC=false, gotE=false;
  onValue(R("config"), snap=>{
    const v=snap.val();
    if(v) S.config={ version:v.version||"", halls:arr(v.halls).map(h=>({id:h.id,code:h.code||"",theme:h.theme||"",color:h.color||""})), categories:arr(v.categories).map(c=>({id:c.id,name:c.name||"",en:c.en||""})) };
    gotC=true; S.loaded=gotC&&gotE; render();
  });
  onValue(R("exhibitors"), snap=>{
    const v=snap.val()||{};
    S.ex = Object.entries(v).map(([id,e])=>({id,...e,cats:arr(e.cats)}));
    gotE=true; S.loaded=gotC&&gotE; render();
  });
  onValue(ref(db,".info/connected"), s=>{ S.online=!!s.val(); render(); });
}

render();
init().catch(()=>{ $("#main").innerHTML='<div class="empty" style="margin-top:18px">서버에 연결하지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요.</div>'; });

/* ── 서비스워커 (홈 화면 앱 + 자동 갱신) ── */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!refreshing){ refreshing=true; location.reload(); } });
}
</script>
